[package]
name = "wild-wheels-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
panic = "abort"
