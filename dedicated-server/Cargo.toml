[package]
name = "wild-wheels-server"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "net", "time", "sync", "signal"] }
futures-util = "=0.3.31"
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
wild-wheels-core = { path = "../rust-core" }

[build-dependencies]
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = true
strip = "symbols"

