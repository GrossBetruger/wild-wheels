[package]
name = "wild-wheels-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
wild-wheels-core = { path = "../rust-core" }
bevy = { version = "=0.20.1", default-features = false, features = ["std", "default_app", "3d_bevy_render", "bevy_winit", "bevy_ui", "bevy_ui_render", "default_font", "multi_threaded", "bevy_audio", "wav", "keyboard", "mouse"] }
crossbeam-channel = "0.5"
# Inflates the compressed graphics pack; already used by Bevy's image loading.
miniz_oxide = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "cookies", "rustls"] }
futures-util = "=0.3.31"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
directories = "6"
url = "2"

[profile.release]
# Thin link-time optimization and no symbol tables: a smaller, faster player build.
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
