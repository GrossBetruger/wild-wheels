[package]
name = "wild-wheels-wasm-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
wild-wheels-core = { path = "../rust-core" }
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "default_app",
    "3d_bevy_render",
    "bevy_winit",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_audio",
    "wav",
    "bevy_gltf",
    "bevy_scene",
    "keyboard",
    "mouse",
    "webgl2",
] }
crossbeam-channel = "0.5"
miniz_oxide = "=0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
