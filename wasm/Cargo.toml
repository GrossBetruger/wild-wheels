[package]
name = "wild-wheels-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
wild-wheels-core = { path = "../rust-core" }
wild-wheels-render = { path = "../bevy-render" }
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "default_app",
    "3d_bevy_render",
    "bevy_winit",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_audio",
    "wav",
    "bevy_gltf",
    "gltf_animation",
    "morph",
    "bevy_scene",
    "keyboard",
    "mouse",
    "webgl2",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true

# wasm-bindgen reads target_features from the linked module before generating bindings.
[profile.release.package.wild-wheels-wasm]
strip = "debuginfo"
