name: Multiplayer regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:regression -- --functional --repeat 1 --output-dir regression-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: multiplayer-regression-traces
          path: regression-results/
          retention-days: 30
  native-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: ./install_ubuntu.sh
      - run: sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck install_ubuntu.sh run_server.sh run_client.sh kill_server.sh update_server.sh scripts/server/server-process.sh scripts/checks/check-ubuntu-install.sh
      - run: npm ci --ignore-scripts
      - run: cargo +1.90.0 test --locked --manifest-path dedicated-server/Cargo.toml
      - run: cargo +1.90.0 build --release --locked --manifest-path dedicated-server/Cargo.toml
      - run: npm run test:server-commands
      - run: npm run test:dedicated -- --seconds 10
