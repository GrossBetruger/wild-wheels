name: Multiplayer regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:regression -- --functional --repeat 1 --output-dir regression-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: multiplayer-regression-traces
          path: regression-results/
          retention-days: 30
  native-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: ./install_ubuntu.sh
      - run: sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck install_ubuntu.sh run_server.sh kill_server.sh update_server.sh scripts/server-process.sh scripts/check-ubuntu-install.sh
      - run: npm ci --ignore-scripts
      - run: cargo +1.90.0 test --locked --manifest-path dedicated-server/Cargo.toml
      - run: cargo +1.90.0 build --release --locked --manifest-path dedicated-server/Cargo.toml
      - run: npm run test:server-commands
      - run: npm run test:dedicated -- --seconds 10
